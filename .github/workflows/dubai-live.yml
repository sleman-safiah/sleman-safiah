name: Dubai Live banner

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render banner for the current Dubai time and weather
        run: python3 scripts/dubai_live.py --out assets/dubai-live.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dubai-live.svg
          git diff --cached --quiet || (git commit -m "chore: refresh Dubai banner" && git push)
